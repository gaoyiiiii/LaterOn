<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 小红书等站点的图片 CDN 会拒绝来自 chrome-extension:// 的 Referer（返回 403），
         整页统一不发 Referer，收藏的封面与站点图标才能正常显示。 -->
    <meta name="referrer" content="no-referrer" />
    <title>LaterOn - 没看完的网页，留到 LaterOn。</title>
    <link rel="icon" href="icon128.png" type="image/png" />
    <link rel="stylesheet" href="theme-vars.css" />
    <link rel="stylesheet" href="dialog.css" />
    <link rel="stylesheet" href="onboarding.css" />
    <link rel="stylesheet" href="library.css" />
    <script src="theme.js"></script>
    <script src="i18n.js"></script>
    <script src="dialog.js"></script>
    <script src="picker-ui.js"></script>
    <script src="onboarding.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" id="homeBrand" href="#" data-i18n-aria-label="home" data-i18n-title="home" aria-label="LaterOn 首页" title="回到首页"><img class="brand-icon" src="icon128.png" width="40" height="40" alt="" />LaterOn</a>
        <nav data-i18n-aria-label="filterNav" aria-label="筛选">
          <button class="nav-item active" data-filter="unread" data-i18n="unread">未读</button>
          <button class="nav-item" data-filter="done" data-i18n="read">已读</button>
          <button class="nav-item" data-filter="all" data-i18n="all">全部</button>
        </nav>
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.3-4.3m2.3-5.2a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
          <input id="searchInput" type="search" data-i18n-placeholder="search" placeholder="搜索收藏" autocomplete="off" />
          <kbd>⌘ K</kbd>
        </label>
      </header>

      <div class="workspace">
        <aside class="project-sidebar" data-i18n-aria-label="projectNav" aria-label="项目导航">
          <!-- 「待整理」单独占一块，钉在侧栏最上面：它不是一个普通筛选项，
               而是一个待办——有东西堆在这里就该去归位。有内容时整块高亮。
               仍然带 .project-nav，所以点击切换、拖收藏进来归类的行为都照旧。 -->
          <button class="project-nav inbox-card" data-project="unfiled">
            <span class="inbox-icon">
              <!-- 用户提供的收藏夹图标：重绘为真正的矢量路径，以便跟随 currentColor。 -->
              <svg class="nav-art-icon" viewBox="0 0 24 24" aria-hidden="true">
                <defs>
                  <mask id="lateron-favorites-front">
                    <rect width="24" height="24" fill="#000"/>
                    <path d="M3 10.4h5.1l1.55 1.75h9.1A2.25 2.25 0 0 1 21 14.4v4.15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 18.55Z" fill="#fff"/>
                    <path d="m12 13.2.94 1.9 2.1.3-1.52 1.48.36 2.1L12 18l-1.88.98.36-2.1-1.52-1.48 2.1-.3Z" fill="#000"/>
                  </mask>
                </defs>
                <path d="M6.1 3.4h4.15l1.4 1.55h6.2a1.8 1.8 0 0 1 1.8 1.8v8.1H6.1Z" opacity=".28"/>
                <path d="M4.45 6.7H8.7l1.45 1.6h6.7a1.9 1.9 0 0 1 1.9 1.9v7H4.45Z" opacity=".5"/>
                <rect width="24" height="24" mask="url(#lateron-favorites-front)"/>
              </svg>
            </span>
            <span class="inbox-body">
              <strong class="inbox-title" data-i18n="inbox">等待整理</strong>
              <small class="inbox-hint" data-i18n="noInbox">还没有要整理的</small>
            </span>
            <span class="inbox-count" id="unfiledCount">0</span>
          </button>
          <button class="project-nav top-entry" data-project="all">
            <span class="nav-icon all-icon">
              <!-- 用户提供的三列项目面板：保留层次明暗，颜色跟随 currentColor。 -->
              <svg class="nav-art-icon" viewBox="0 0 24 24" aria-hidden="true">
                <defs>
                  <mask id="lateron-project-columns">
                    <rect width="24" height="24" fill="#000"/>
                    <rect x="2.3" y="3" width="5.7" height="18" rx="1.8" fill="#fff"/>
                    <rect x="9.15" y="3" width="5.7" height="18" rx="1.8" fill="#fff"/>
                    <rect x="16" y="3" width="5.7" height="18" rx="1.8" fill="#fff"/>
                    <rect x="3.45" y="5.15" width="3.4" height="1.55" rx=".78" fill="#000"/>
                    <rect x="3.45" y="8.1" width="3.4" height="1.55" rx=".78" fill="#000"/>
                    <rect x="3.55" y="12.2" width="3.2" height="5.9" rx="1.15" fill="#000" opacity=".42"/>
                    <rect x="10.3" y="5.15" width="3.4" height="1.55" rx=".78" fill="#000"/>
                    <rect x="10.3" y="8.1" width="3.4" height="1.55" rx=".78" fill="#000"/>
                    <rect x="10.4" y="12.2" width="3.2" height="5.9" rx="1.15" fill="#000" opacity=".42"/>
                    <rect x="17.15" y="5.15" width="3.4" height="1.55" rx=".78" fill="#000"/>
                    <rect x="17.15" y="8.1" width="3.4" height="1.55" rx=".78" fill="#000"/>
                    <rect x="17.25" y="12.2" width="3.2" height="5.9" rx="1.15" fill="#000" opacity=".42"/>
                  </mask>
                </defs>
                <g mask="url(#lateron-project-columns)">
                  <rect x="2.3" y="3" width="5.7" height="18" rx="1.8"/>
                  <rect x="9.15" y="3" width="5.7" height="18" rx="1.8" opacity=".52"/>
                  <rect x="16" y="3" width="5.7" height="18" rx="1.8" opacity=".3"/>
                </g>
              </svg>
            </span>
            <span data-i18n="allProjectsOverview">全部项目</span><strong class="nav-count" id="allCount">0</strong>
          </button>
          <!-- 项目列表始终接在“全部项目”下方，并通过缩进和较小尺寸表达从属关系。 -->
          <div class="projects-section">
            <div id="projectList" class="project-list"></div>
          </div>
          <div class="sidebar-footer">
            <button id="openSettings" class="sidebar-setting" type="button" title="设置" aria-label="设置">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              <span data-i18n="settings">设置</span>
            </button>
            <p class="sidebar-slogan" data-i18n="slogan">没看完的网页，留到 LaterOn。</p>
          </div>
        </aside>

        <main>
        <section class="collection-bar">
          <div class="collection-left">
            <p id="countText">正在读取你的收藏…</p>
            <button id="selectMode" type="button" class="select-mode" data-i18n="select">选择</button>
          </div>
          <div class="collection-right">
            <!-- 全部项目固定是图板视图，待整理 / 单个项目是卡片视图，不再需要手动切换 -->
            <select id="sortSelect" data-i18n-aria-label="sortAria" aria-label="排序方式">
              <option value="newest" data-i18n="sortNewest">最新收藏</option>
              <option value="oldest" data-i18n="sortOldest">最早收藏</option>
              <option value="source" data-i18n="sortSource">按来源</option>
              <option value="custom" data-i18n="sortCustom">自定义顺序</option>
            </select>
          </div>
        </section>

        <section id="emptyState" class="empty" hidden>
          <img class="empty-icon" src="icon128.png" alt="" />
          <h2 data-i18n="quiet">这里还很安静</h2>
          <p data-i18n="quietHint">打开一个想稍后阅读的网页，点击浏览器工具栏中的 LaterOn 图标即可收藏。</p>
        </section>
        <section id="cardGrid" class="grid" aria-live="polite"></section>
        <section id="boardGrid" class="board-grid" aria-live="polite" hidden></section>
        </main>

      </div>
    </div>

    <template id="cardTemplate">
      <article class="card">
        <label class="select-badge" data-i18n-aria-label="selectItem" aria-label="选择此收藏"><input type="checkbox" class="select-check" /></label>
        <a class="cover-link" target="_blank" rel="noreferrer">
          <div class="cover">
            <div class="cover-placeholder"><img class="cover-logo" src="article-cover-placeholder.png" alt="" /></div>
          </div>
        </a>
        <button class="edit" data-i18n-title="editItemAria" data-i18n-aria-label="editItemAria" title="编辑标题和摘要" aria-label="编辑标题和摘要">
          <svg viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16zM14 6l4 4"/></svg>
        </button>
        <div class="card-body">
          <div class="source-row"><img class="favicon" alt="" referrerpolicy="no-referrer" /><span class="source-name"></span><span class="dot">·</span><time></time></div>
          <a class="title-link" target="_blank" rel="noreferrer"><h2></h2></a>
          <p class="description"></p>
          <footer>
            <button class="read-toggle" data-i18n-title="readStateAria" title="切换阅读状态"></button>
            <select class="project-select" data-i18n-aria-label="projectMembership" aria-label="所属项目"></select>
            <button class="delete" data-i18n-title="deleteSave" data-i18n-aria-label="deleteSave" title="删除收藏" aria-label="删除收藏">
              <svg viewBox="0 0 24 24"><path d="M4 7h16m-10 4v6m4-6v6M9 7l1-3h4l1 3m3 0-1 13H7L6 7"/></svg>
            </button>
          </footer>
        </div>
      </article>
    </template>

    <!-- 图板视图：一个类目 = 一张图板。封面由这个类目里最新几篇的封面拼成
         （一张大的 + 两张小的），下方是类目名、简介和篇数。 -->
    <template id="boardTemplate">
      <article class="board-card">
        <div class="board-cover" data-count="0"></div>
        <button class="board-edit" type="button" data-i18n-title="editProjectAria" data-i18n-aria-label="editProjectAria" title="编辑类目简介" aria-label="编辑类目简介">
          <svg viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16zM14 6l4 4"/></svg>
        </button>
        <div class="board-body">
          <h3 class="board-name"></h3>
          <p class="board-note"></p>
          <p class="board-meta"></p>
        </div>
      </article>
    </template>

    <div id="bulkBar" class="bulk-bar">
          <span id="bulkCount" class="bulk-count" data-i18n="selectCount">已选 0 篇</span>
      <div class="bulk-actions">
        <button id="bulkSelectAll" type="button" data-i18n="selectAll">全选</button>
        <button id="bulkRead" type="button" data-i18n="markDone">标完成</button>
        <button id="bulkUnread" type="button" data-i18n="markUnread">标未读</button>
        <button id="bulkOpenWindow" type="button" data-i18n="openInNewWindow">在新窗口打开</button>
        <button id="bulkProject" class="bulk-project" type="button" data-i18n-aria-label="moveTo" aria-label="移动到项目" aria-haspopup="dialog">
          <span data-i18n="moveTo">移动到…</span>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
        </button>
        <button id="bulkDelete" type="button" class="danger" data-i18n="delete">删除</button>
        <button id="bulkDone" type="button" class="primary" data-i18n="done">完成</button>
      </div>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script src="url-utils.js"></script>
    <script src="tab-navigation.js"></script>
    <script src="library.js"></script>
  </body>
</html>
