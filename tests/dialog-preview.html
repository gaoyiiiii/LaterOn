<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaterOn · 弹窗效果预览</title>
    <style>
      /* ── 主题变量（内联自 theme-vars.css，和真实页面一致）── */
:root {
  color-scheme: light;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --ink: #171614;
  --muted: #8a857c;
  --paper: #f4f2ec;
  --card: #ffffff;
  --line: #e8e5dd;
  --accent: #ff5c35;
  --accent-soft: #fff1ec;
  --radius: 20px;
  --shadow-sm: 0 1px 2px rgba(20,18,14,.04), 0 6px 16px -10px rgba(20,18,14,.12);
  --shadow-md: 0 2px 4px rgba(20,18,14,.05), 0 18px 40px -18px rgba(20,18,14,.24);
  --shadow-pill: 0 22px 55px -10px rgba(15,13,10,.45), 0 6px 18px rgba(0,0,0,.22);
  /* 语义表面 */
  --bg-grad: radial-gradient(130% 100% at 50% -10%, #fbfaf7 0%, #f1efe8 55%, #eeebe3 100%);
  --topbar-bg: rgba(244,242,236,.72);
  --glass: rgba(255,255,255,.72);
  --glass-soft: rgba(255,255,255,.6);
  --glass-strong: rgba(255,255,255,.92);
  --field: #ffffff;
  --field-soft: #f5f3ee;
  --field-text: #4f4c46;
  --btn-soft: #f1f0eb;
  --btn-soft-hover: #e7e5df;
  --chip: rgba(255,255,255,.6);
  --chip-text: #7b776e;
  --subtle: #aaa69d;
  --hairline: rgba(23,22,20,.07);
  --hairline-2: rgba(23,22,20,.06);
  --card-line: rgba(23,22,20,.08);
  --cover-bg: #e4e0d7;
  --cover-ph: linear-gradient(140deg, #fff5f0 0%, #ffe8dd 100%);
  --cover-ph-shadow: 0 12px 26px -14px rgba(255,92,53,.75);
  --code-bg: #2b2a27;
  --code-text: #f3f1ec;
  --code-inline-bg: #eceae3;
  --quote-bg: #ffffff;
  --active-bg: #171614;
  --active-text: #ffffff;
  --toast-bg: #171614;
}

[data-theme="dark"] {
  color-scheme: dark;
  --ink: #f3f1ec;
  --muted: #9a958c;
  --paper: #151413;
  --card: #211f1d;
  --line: #353230;
  --accent: #ff6a45;
  --accent-soft: #3a241d;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4), 0 6px 16px -10px rgba(0,0,0,.6);
  --shadow-md: 0 2px 4px rgba(0,0,0,.5), 0 18px 40px -18px rgba(0,0,0,.7);
  --shadow-pill: 0 22px 55px -10px rgba(0,0,0,.7), 0 6px 18px rgba(0,0,0,.5);
  --bg-grad: radial-gradient(130% 100% at 50% -10%, #1d1c1a 0%, #141312 55%, #0e0d0c 100%);
  --topbar-bg: rgba(21,20,19,.7);
  --glass: rgba(255,255,255,.07);
  --glass-soft: rgba(255,255,255,.05);
  --glass-strong: rgba(255,255,255,.1);
  --field: #2a2725;
  --field-soft: #2a2725;
  --field-text: #d8d3ca;
  --btn-soft: #2f2c29;
  --btn-soft-hover: #38342f;
  --chip: rgba(255,255,255,.07);
  --chip-text: #b8b3aa;
  --subtle: #857f76;
  --hairline: rgba(255,255,255,.08);
  --hairline-2: rgba(255,255,255,.07);
  --card-line: rgba(255,255,255,.1);
  --cover-bg: #2a2725;
  --cover-ph: linear-gradient(140deg, #2e2320 0%, #3b2a23 100%);
  --cover-ph-shadow: 0 12px 26px -14px rgba(0,0,0,.85);
  --code-bg: #100f0e;
  --code-text: #f3f1ec;
  --code-inline-bg: #322f2c;
  --quote-bg: #211f1d;
  --active-bg: rgba(255,255,255,.16);
  --active-text: #ffffff;
  --toast-bg: rgba(45,42,38,.96);
}


      /* ── 预览页自己的外壳样式，只为把弹窗摆出来看 ── */
      body {
        margin: 0;
        min-height: 100vh;
        padding: 40px 24px;
        background: var(--bg-grad);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .demo { max-width: 760px; margin: 0 auto; }
      .demo-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 26px; }
      .demo-logo {
        display: grid; place-items: center; flex: none;
        width: 40px; height: 40px; border-radius: 13px;
        background: linear-gradient(140deg, #ff7a52, #ff4f2e);
        color: #fff; font-size: 21px; line-height: 1;
        box-shadow: 0 10px 22px -10px rgba(255,80,50,.85);
      }
      .demo-head h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.4px; }
      .demo-head p { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
      .demo-theme {
        margin-left: auto; flex: none;
        border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px;
        background: var(--card); color: var(--ink);
        font-family: inherit; font-size: 12.5px; font-weight: 650; cursor: pointer;
      }
      .demo-theme:hover { background: var(--btn-soft); }
      .demo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(224px, 1fr)); gap: 10px; }
      .demo-btn {
        display: flex; flex-direction: column; gap: 5px; align-items: flex-start;
        border: 1px solid var(--line); border-radius: 15px; padding: 15px 16px;
        background: var(--card); color: var(--ink);
        font-family: inherit; text-align: left; cursor: pointer;
        box-shadow: var(--shadow-sm);
        transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
      }
      .demo-btn:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow-md); }
      .demo-btn strong { font-size: 13.5px; font-weight: 750; }
      .demo-btn span { color: var(--muted); font-size: 11.5px; line-height: 1.5; }
      .demo-tip {
        margin: 22px 0 0; padding: 13px 15px;
        border: 1px solid var(--line); border-radius: 14px;
        background: var(--glass-soft); color: var(--muted);
        font-size: 12.5px; line-height: 1.65;
      }
      .demo-tip strong { color: var(--ink); }

      /* ── 弹窗的真实样式（内联自 dialog.css）── */
/* 共享的自定义弹窗（取代浏览器原生 confirm / alert）。
   视觉与「选项目」浮层保持一致：同圆角、同阴影、同橙色渐变按钮。
   颜色取 theme-vars.css 的变量并带兜底值，因此没引入主题变量的页面也能正常显示。 */

.lod-root {
  position: fixed;
  inset: 0;
  z-index: 2147483000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  --lod-card: var(--card, #ffffff);
  --lod-ink: var(--ink, #171614);
  --lod-muted: var(--muted, #8a857c);
  --lod-line: var(--line, #e8e5dd);
  --lod-soft: var(--btn-soft, #f1f0eb);
  --lod-soft-hover: var(--btn-soft-hover, #e7e5df);
  --lod-subtle: var(--subtle, #aaa69d);
  --lod-danger: #dc3f22;
  --lod-danger-soft: rgba(220,63,34,.12);
  --lod-panel-shadow: 0 34px 80px -24px rgba(15,13,10,.5), 0 8px 26px -10px rgba(15,13,10,.2);
}
.lod-root[hidden] { display: none; }
[data-theme="dark"] .lod-root {
  --lod-danger: #ff7a5c;
  --lod-danger-soft: rgba(255,122,92,.16);
  --lod-panel-shadow: 0 34px 80px -24px rgba(0,0,0,.82), 0 8px 26px -10px rgba(0,0,0,.55);
}
[data-theme="dark"] .lod-backdrop { background: rgba(0,0,0,.56); }
.lod-root, .lod-root *, .lod-root *::before, .lod-root *::after { box-sizing: border-box; }

.lod-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(20,18,14,.44);
  -webkit-backdrop-filter: blur(4px) saturate(130%);
  backdrop-filter: blur(4px) saturate(130%);
  opacity: 0;
  transition: opacity .22s ease;
}

.lod-panel {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 15px;
  width: min(400px, 100%);
  padding: 24px 24px 20px;
  border: 1px solid var(--lod-line);
  border-radius: 22px;
  background: var(--lod-card);
  box-shadow: var(--lod-panel-shadow);
  opacity: 0;
  transform: translateY(12px) scale(.97);
  transition: opacity .24s ease, transform .3s cubic-bezier(.2,.8,.3,1);
  outline: none;
}
.lod-root.is-in .lod-backdrop { opacity: 1; }
.lod-root.is-in .lod-panel { opacity: 1; transform: none; }
.lod-root.is-out .lod-backdrop { opacity: 0; }
.lod-root.is-out .lod-panel { opacity: 0; transform: translateY(8px) scale(.98); }

.lod-head { display: flex; align-items: flex-start; gap: 13px; }
.lod-icon {
  display: grid;
  place-items: center;
  flex: none;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--accent-soft, #fff1ec);
  color: var(--accent, #ff5c35);
}
.lod-icon svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.lod-root[data-tone="danger"] .lod-icon { background: var(--lod-danger-soft); color: var(--lod-danger); }

.lod-copy { min-width: 0; padding-top: 2px; }
.lod-title {
  margin: 0;
  color: var(--lod-ink);
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -.3px;
  line-height: 1.35;
  word-break: break-word;
}
.lod-message {
  margin: 7px 0 0;
  color: var(--lod-muted);
  font-size: 13px;
  line-height: 1.62;
  word-break: break-word;
}
.lod-message[hidden] { display: none; }

/* ── 表单模式（编辑标题 / 摘要）──────────────────────────── */
.lod-fields { display: grid; gap: 12px; }
.lod-fields[hidden] { display: none; }
.lod-field { display: grid; gap: 6px; }
.lod-field-label { color: var(--lod-muted); font-size: 11.5px; font-weight: 650; letter-spacing: .2px; }
.lod-input, .lod-textarea {
  width: 100%;
  border: 1px solid var(--lod-line);
  border-radius: 13px;
  padding: 10px 12px;
  background: var(--lod-soft);
  color: var(--lod-ink);
  font-family: inherit;
  font-size: 13.5px;
  line-height: 1.62;
  outline: none;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.lod-textarea { min-height: 96px; max-height: 38vh; resize: vertical; }
.lod-input::placeholder, .lod-textarea::placeholder { color: var(--lod-subtle); }
.lod-input:focus, .lod-textarea:focus {
  border-color: var(--accent, #ff5c35);
  background: var(--lod-card);
  box-shadow: 0 0 0 4px rgba(255,92,53,.12);
}
[data-theme="dark"] .lod-input, [data-theme="dark"] .lod-textarea { background: rgba(255,255,255,.04); }

/* ── 封面上传区：左边小预览，右边两个按钮 ── */
.lod-cover { display: grid; gap: 6px; }
.lod-cover[hidden] { display: none; }
.lod-cover-row { display: flex; align-items: center; gap: 12px; }
.lod-cover-preview {
  display: grid; place-items: center; flex: none;
  width: 76px; height: 52px; overflow: hidden;
  border: 1px solid var(--lod-line); border-radius: 10px;
  background: var(--lod-soft); color: var(--lod-subtle); font-size: 11px;
}
.lod-cover-preview img { width: 100%; height: 100%; object-fit: cover; }
.lod-cover-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.lod-cover-btn {
  border: 1px solid var(--lod-line); border-radius: 11px; padding: 7px 13px;
  background: var(--lod-soft); color: var(--lod-ink);
  font-size: 12px; font-weight: 650; cursor: pointer; transition: background .15s, border-color .15s;
}
.lod-cover-btn:hover:not(:disabled) { border-color: var(--accent, #ff5c35); color: var(--accent, #ff5c35); }
.lod-cover-btn:disabled { opacity: .45; cursor: default; }
.lod-cover-btn.is-plain { background: transparent; }
.lod-cover-note { margin: 0; color: var(--lod-subtle); font-size: 11px; line-height: 1.5; }

.lod-hint { margin: 0; color: var(--lod-subtle); font-size: 11.5px; text-align: center; }
.lod-hint[hidden] { display: none; }

.lod-foot { display: flex; gap: 10px; margin-top: 3px; }
.lod-foot button {
  border-radius: 14px;
  padding: 12px;
  font-family: inherit;
  font-size: 13.5px;
  cursor: pointer;
  transition: filter .15s, background .15s, transform .12s;
}
.lod-cancel {
  flex: 1;
  border: 1px solid var(--lod-line);
  background: transparent;
  color: var(--lod-ink);
  font-weight: 650;
}
.lod-cancel:hover { background: var(--lod-soft); }
.lod-cancel[hidden] { display: none; }
.lod-ok {
  flex: 1.5;
  border: 0;
  background: linear-gradient(140deg, #ff7a52, #ff4f2e);
  color: #fff;
  font-weight: 750;
  box-shadow: 0 8px 20px -8px rgba(255,79,46,.9);
}
.lod-root[data-tone="danger"] .lod-ok {
  background: linear-gradient(140deg, #f4694b, #db3a1c);
  box-shadow: 0 8px 20px -8px rgba(219,58,28,.85);
}
.lod-ok:hover { filter: brightness(1.05); }
.lod-ok:active { transform: scale(.985); }
.lod-foot button:focus-visible { outline: 2px solid var(--accent, #ff5c35); outline-offset: 2px; }
.lod-cancel[hidden] + .lod-ok { flex: 1; }

@media (max-width: 460px) {
  .lod-root { padding: 14px; }
  .lod-panel { gap: 12px; padding: 18px 16px 14px; border-radius: 18px; }
  .lod-title { font-size: 16px; }
  .lod-icon { width: 34px; height: 34px; border-radius: 11px; }
}

@media (prefers-reduced-motion: reduce) {
  .lod-backdrop, .lod-panel { transition-duration: .01ms; }
}

    </style>

  <body>
    <div class="demo">
      <div class="demo-head">
        <span class="demo-logo">↗</span>
        <div>
          <h1>LaterOn 弹窗效果预览</h1>
          <p>下面是应用里真实使用的弹窗组件，点任意按钮即可看到实际效果。</p>
        </div>
        <button class="demo-theme" id="themeToggle" type="button">切换深色</button>
      </div>

      <div class="demo-grid">
        <button class="demo-btn" type="button" data-demo="deleteFolder">
          <strong>删除项目的确认</strong>
          <span>危险操作：红色主题 + 警示图标</span>
        </button>
        <button class="demo-btn" type="button" data-demo="bulkDelete">
          <strong>批量删除的确认</strong>
          <span>会写清要删几篇</span>
        </button>
        <button class="demo-btn" type="button" data-demo="wipe">
          <strong>清空所有收藏的确认</strong>
          <span>设置页里的那个</span>
        </button>
        <button class="demo-btn" type="button" data-demo="importOk">
          <strong>导入完成</strong>
          <span>成功提示：绿色对勾图标</span>
        </button>
        <button class="demo-btn" type="button" data-demo="importFail">
          <strong>导入失败</strong>
          <span>错误提示：红色主题</span>
        </button>
        <button class="demo-btn" type="button" data-demo="shortcuts">
          <strong>没能打开快捷键设置</strong>
          <span>普通提示：只有一个按钮</span>
        </button>
      </div>

      <p class="demo-tip" id="result">
        <strong>交互都一样：</strong>回车 = 确认，Esc = 取消，点背景也能取消；提示类只有一个按钮。
        同一时刻只会显示一个弹窗，连着点会排队依次出现。
      </p>
    </div>

    <script>
      /* ── 弹窗的真实实现（内联自 dialog.js）── */
// 共享的自定义弹窗：取代浏览器原生 confirm / alert，视觉与「选项目」浮层一致。
// 页面需引入 dialog.css + dialog.js，然后：
//   const ok = await LaterOnDialog.confirm({ title: "删除项目？", message: "…", tone: "danger", confirmText: "删除" });
//   await LaterOnDialog.alert({ title: "已清空所有收藏", message: "…", tone: "success" });
//   // 带输入框的（改标题 / 摘要就用的这个）：
//   const result = await LaterOnDialog.prompt({
//     title: "编辑收藏信息",
//     fields: [
//       { name: "title", label: "标题", value: "原标题" },
//       { name: "description", label: "摘要", value: "原摘要", multiline: true }
//     ]
//   });
//   if (result.ok) save(result.values.title, result.values.description);
//   // 额外加一块「封面上传」（选本地图片，自动压缩后作为该字段的值返回）：
//   const result = await LaterOnDialog.prompt({
//     title: "编辑收藏信息",
//     fields: [ … ],
//     cover: { name: "cover", label: "封面", value: item.image || "" }
//   });
//   // result.values.cover 是 data URL（用户上传）、""（用户移除/本来没封面），或与传入的 value 相同（没动过）
//   // 如果传入的 value 不是「用户自己的封面」而是按内容自动取的一张（项目图板就是这样），
//   // 传 cover.derived = true：移除按钮会先禁用（没有自定义封面可移除），上传后自动放开。
// 也支持字符串简写：LaterOnDialog.confirm("确定删除吗？")
// 交互：回车确认（多行输入框里 ⌘/Ctrl + 回车）、Esc 取消、点遮罩取消；
// 同一时刻只显示一个弹窗（自动排队，不会互相叠加）。
(function () {
  const ICONS = {
    question: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.3a2.9 2.9 0 0 1 5.6 1c0 1.9-2.9 2.3-2.9 4.2M12 17.2h.01"/></svg>',
    danger: '<svg viewBox="0 0 24 24"><path d="M10.3 3.9 2.5 17.4A2 2 0 0 0 4.2 20.4h15.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9.4v4.4M12 17h.01"/></svg>',
    info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11.2v5.4M12 7.6h.01"/></svg>',
    success: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.3 12.5 2.6 2.6 5-5.6"/></svg>'
  };
  const CLOSE_MS = 240;

  // ── 封面上传 ─────────────────────────────────────────────
  // 浏览器扩展的本地存储只有几 MB 的配额，一张手机照直接存进去很快就爆了。
  // 所以选中图片后先等比缩到最长边 720px、再压成 JPEG，单张大约 50–80KB。
  const COVER_MAX_EDGE = 720;
  const COVER_QUALITY = 0.72;
  const COVER_MAX_BYTES = 20 * 1024 * 1024;   // 超过 20MB 的原图直接拒绝，免得卡住页面
  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("这张图读取失败，换一张试试"));
      reader.onload = () => {
        const image = new Image();
        image.onerror = () => reject(new Error("这个文件不是能显示的图片"));
        image.onload = () => {
          const scale = Math.min(1, COVER_MAX_EDGE / Math.max(image.naturalWidth || image.width, image.naturalHeight || image.height, 1));
          const width = Math.max(1, Math.round((image.naturalWidth || image.width) * scale));
          const height = Math.max(1, Math.round((image.naturalHeight || image.height) * scale));
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const context = canvas.getContext && canvas.getContext("2d");
          if (!context) { reject(new Error("当前环境不支持处理图片")); return; }
          // 先铺白底：PNG 透明区域转成 JPEG 后会变黑。
          context.fillStyle = "#ffffff";
          context.fillRect(0, 0, width, height);
          context.drawImage(image, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", COVER_QUALITY));
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  let host = null;
  let panel = null;
  let iconEl = null;
  let titleEl = null;
  let messageEl = null;
  let fieldsEl = null;
  let coverEl = null;
  let coverValue = "";       // 封面区当前的值：data URL（上传了）或 ""（没封面/已移除）
  let fieldInputs = [];
  let hintEl = null;
  let okBtn = null;
  let cancelBtn = null;

  let current = null;   // 当前弹窗的配置
  let settle = null;    // 当前弹窗的收尾回调（为空表示没有弹窗在显示）
  let chain = Promise.resolve();

  function build() {
    if (host) return;
    const mount = document.body || document.documentElement;
    host = document.createElement("div");
    host.className = "lod-root";
    host.hidden = true;
    host.setAttribute("role", "dialog");
    host.setAttribute("aria-modal", "true");
    host.innerHTML = [
      '<div class="lod-backdrop"></div>',
      '<div class="lod-panel" tabindex="-1">',
      '  <div class="lod-head">',
      '    <span class="lod-icon" aria-hidden="true"></span>',
      '    <div class="lod-copy">',
      '      <h2 class="lod-title"></h2>',
      '      <p class="lod-message"></p>',
      '    </div>',
      '  </div>',
      '  <div class="lod-fields" hidden></div>',
      '  <div class="lod-cover" hidden></div>',
      '  <p class="lod-hint"></p>',
      '  <div class="lod-foot">',
      '    <button type="button" class="lod-cancel">取消</button>',
      '    <button type="button" class="lod-ok">确定</button>',
      '  </div>',
      '</div>'
    ].join("");
    mount.append(host);

    panel = host.querySelector(".lod-panel");
    iconEl = host.querySelector(".lod-icon");
    titleEl = host.querySelector(".lod-title");
    messageEl = host.querySelector(".lod-message");
    fieldsEl = host.querySelector(".lod-fields");
    coverEl = host.querySelector(".lod-cover");
    hintEl = host.querySelector(".lod-hint");
    okBtn = host.querySelector(".lod-ok");
    cancelBtn = host.querySelector(".lod-cancel");

    host.querySelector(".lod-backdrop").addEventListener("click", () => {
      if (current?.cancelable) settleWith(false);
    });
    cancelBtn.addEventListener("click", () => settleWith(false));
    okBtn.addEventListener("click", () => settleWith(true));
    host.addEventListener("keydown", onKeydown, true);
  }

  function onKeydown(event) {
    if (!settle) return;
    if (event.key === "Escape") {
      if (!current?.cancelable) return;
      event.preventDefault();
      event.stopPropagation();
      settleWith(false);
      return;
    }
    const focusables = [...fieldInputs.map((entry) => entry.el), cancelBtn, okBtn]
      .filter((element) => element && !element.hidden);
    if (event.key === "Tab") {
      if (!focusables.length) return;
      const index = focusables.indexOf(document.activeElement);
      const next = event.shiftKey
        ? (index <= 0 ? focusables.length - 1 : index - 1)
        : (index === -1 || index === focusables.length - 1 ? 0 : index + 1);
      event.preventDefault();
      focusables[next].focus();
      return;
    }
    if (event.key === "Enter") {
      // 焦点已经在按钮上时交给按钮自己处理，避免触发两次。
      const active = document.activeElement;
      if (active === okBtn || active === cancelBtn) return;
      // 多行输入框里回车 = 换行（写摘要时要分段）；想直接保存按 ⌘/Ctrl + 回车。
      if (active?.tagName === "TEXTAREA" && !(event.metaKey || event.ctrlKey)) return;
      event.preventDefault();
      settleWith(true);
    }
  }

  // 表单模式：按配置渲染一行行输入框（单行用 input，多行用 textarea）。
  function renderFields(fields) {
    fieldInputs = [];
    fieldsEl.replaceChildren();
    if (!fields?.length) { fieldsEl.hidden = true; return; }
    fieldsEl.hidden = false;
    fields.forEach((field) => {
      const wrap = document.createElement("label");
      wrap.className = "lod-field";
      const label = document.createElement("span");
      label.className = "lod-field-label";
      label.textContent = field.label || "";
      const control = document.createElement(field.multiline ? "textarea" : "input");
      if (!field.multiline) control.type = "text";
      control.className = field.multiline ? "lod-textarea" : "lod-input";
      control.dataset.field = field.name || "";
      control.value = String(field.value ?? "");
      if (field.placeholder) control.placeholder = field.placeholder;
      if (field.maxLength) control.maxLength = field.maxLength;
      if (field.multiline) control.rows = field.rows || 4;
      wrap.append(label, control);
      fieldsEl.append(wrap);
      fieldInputs.push({ name: field.name, el: control });
    });
  }

  // 封面区：左边一张小预览，右边「上传图片 / 移除封面」两个按钮。
  // config.cover = { name, label, value, derived }；不传就不显示这一块。
  // derived = true 表示 value 是「按内容自动取的门面图」（项目图板用的就是这个），
  // 不是用户自己传的那张 —— 这种封面没有「移除」的概念，所以移除按钮先禁用，
  // 等用户真的上传了一张自己的图，才让它变得可点。
  function renderCover(config) {
    coverEl.replaceChildren();
    coverValue = config?.value || "";
    if (!config) { coverEl.hidden = true; return; }
    coverEl.hidden = false;
    let custom = !config.derived;   // 预览里的这张图，是不是用户自己定的封面

    const label = document.createElement("span");
    label.className = "lod-field-label";
    label.textContent = config.label || "封面";

    const row = document.createElement("div");
    row.className = "lod-cover-row";

    const preview = document.createElement("div");
    preview.className = "lod-cover-preview";

    const actions = document.createElement("div");
    actions.className = "lod-cover-actions";
    const pickBtn = document.createElement("button");
    pickBtn.type = "button";
    pickBtn.className = "lod-cover-btn";
    pickBtn.textContent = "上传图片";
    const removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.className = "lod-cover-btn is-plain";
    removeBtn.textContent = "移除封面";
    actions.append(pickBtn, removeBtn);

    const note = document.createElement("p");
    note.className = "lod-cover-note";
    note.textContent = config.note || "选一张本地图片，会自动压缩后保存（约 50–80KB）";

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "image/*";
    fileInput.hidden = true;

    function paint() {
      preview.replaceChildren();
      if (coverValue) {
        const img = document.createElement("img");
        img.src = coverValue;
        img.alt = "";
        preview.append(img);
        preview.classList.remove("is-empty");
      } else {
        preview.textContent = "无封面";
        preview.classList.add("is-empty");
      }
      // derived 的封面（按内容自动取的那张）没有「移除」的概念：
      // 移除之后还是它，按钮会骗人，所以那种情况直接禁用。
      removeBtn.disabled = !coverValue || !custom;
    }

    pickBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", async () => {
      const file = fileInput.files && fileInput.files[0];
      // 清空 value，这样连续选同一个文件也会再次触发 change。
      fileInput.value = "";
      if (!file) return;
      if (file.size > COVER_MAX_BYTES) { note.textContent = "这张图太大了（超过 20MB），换一张小点的"; return; }
      pickBtn.disabled = true;
      pickBtn.textContent = "处理中…";
      note.textContent = "正在压缩…";
      try {
        coverValue = await compressImage(file);
        custom = true;
        paint();
        note.textContent = "已就绪，点「保存」生效";
      } catch (error) {
        note.textContent = error?.message || "这张图没能处理，换一张试试";
      } finally {
        pickBtn.disabled = false;
        pickBtn.textContent = "上传图片";
      }
    });
    removeBtn.addEventListener("click", () => {
      coverValue = "";
      custom = false;
      paint();
      // 移除之后会退回到什么，收藏条目和项目图板不一样：前者回到 Logo 占位，
      // 后者回到「按项目里的收藏自动取一张」，所以文案交给调用方定。
      note.textContent = config.removedNote || "已移除，点「保存」生效（会显示 LaterOn 图标占位）";
    });

    row.append(preview, actions);
    coverEl.append(label, row, note, fileInput);
    paint();
  }

  // 把表单里的当前内容收成一个 { 字段名: 值 } 对象。
  function readFields() {
    const values = {};
    for (const entry of fieldInputs) values[entry.name] = entry.el.value;
    return values;
  }

  function show(config, done) {
    build();
    current = config;
    settle = done;

    host.dataset.tone = config.tone === "danger" ? "danger" : "default";
    renderFields(config.fields);
    renderCover(config.cover);
    iconEl.innerHTML = ICONS[config.tone] || ICONS.question;
    titleEl.textContent = config.title;
    messageEl.textContent = config.message;
    messageEl.hidden = !config.message;
    okBtn.textContent = config.confirmText;
    cancelBtn.textContent = config.cancelText;
    cancelBtn.hidden = !config.cancelable;
    // 表单类弹窗（编辑标题/摘要、编辑项目等）默认不再显示底部快捷键提示，
    // 让界面更简洁；只有确认类弹窗保留「回车确认 · Esc 取消」。
    const isForm = !!(current?.fields || current?.cover);
    const fallback = isForm ? "" : (config.cancelable ? "回车确认 · Esc 取消" : "回车确认");
    hintEl.textContent = config.hint || fallback;
    hintEl.hidden = !hintEl.textContent;

    host.hidden = false;
    host.classList.remove("is-out", "is-in");
    const animate = () => host.classList.add("is-in");
    if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(animate);
    else window.setTimeout(animate, 16);
    // 有输入框时把光标放进第一个框并全选，方便直接改写；没有输入框才聚焦面板本体。
    const firstField = fieldInputs[0]?.el;
    if (firstField) {
      firstField.focus();
      if (typeof firstField.select === "function") firstField.select();
    } else if (typeof panel.focus === "function") {
      panel.focus();
    }
  }

  function settleWith(result) {
    if (!settle) return;
    const done = settle;
    const resolved = current;
    // 表单模式不返回布尔值，而是 { ok, values } —— 调用方要拿到用户填的内容。
    let values = null;
    if (resolved?.fields || resolved?.cover) values = result === true ? readFields() : null;
    // 封面不在输入框里，单独塞进结果：值是 data URL 或 ""（移除封面）。
    if (values && resolved?.cover) values[resolved.cover.name || "cover"] = coverValue;
    const value = (resolved?.fields || resolved?.cover)
      ? { ok: result === true, values }
      : result;
    settle = null;
    current = null;
    host.classList.remove("is-in");
    host.classList.add("is-out");
    window.setTimeout(() => {
      host.hidden = true;
      host.classList.remove("is-out");
      done(value);
      if (resolved?.onClose) resolved.onClose(value);
    }, CLOSE_MS);
  }

  function normalize(input, defaults) {
    const base = typeof input === "string" ? { message: input } : { ...(input || {}) };
    return {
      tone: "question",
      title: "",
      message: "",
      confirmText: "确定",
      cancelText: "取消",
      cancelable: true,
      hint: "",
      fields: null,
      cover: null,
      ...defaults,
      ...base
    };
  }

  function open(config) {
    const previous = chain;
    let release = () => {};
    chain = new Promise((resolve) => { release = resolve; });
    return previous.then(() => new Promise((resolve) => {
      try {
        show(config, (value) => {
          release();
          resolve(value);
        });
      } catch (error) {
        console.warn("弹窗显示失败", error);
        release();
        resolve(false);
      }
    }));
  }

  window.LaterOnDialog = {
    confirm: (input) => open(normalize(input, { tone: "question" })),
    alert: (input) => open(normalize(input, { tone: "info", cancelable: false, confirmText: "知道了" })),
    // 带输入框的弹窗。返回 { ok, values }：ok 表示点了确认，values 是 { 字段名: 内容 }。
    prompt: (input) => open(normalize(input, {
      tone: "info",
      confirmText: "保存"
    })),
    close: () => settleWith(false),
    isOpen: () => !!settle
  };
})();

    </script>
    <script>
      const resultEl = document.getElementById("result");
      const demos = {
        deleteFolder: () => LaterOnDialog.confirm({
          tone: "danger",
          title: "删除项目「工作与灵感」？",
          message: "里面的 2 篇收藏会移到「待整理」，不会被删除。",
          confirmText: "删除项目"
        }),
        bulkDelete: () => LaterOnDialog.confirm({
          tone: "danger",
          title: "删除选中的 7 篇收藏？",
          message: "此操作无法撤销。",
          confirmText: "删除 7 篇"
        }),
        wipe: () => LaterOnDialog.confirm({
          tone: "danger",
          title: "清空所有收藏？",
          message: "所有收藏都会被删除，此操作无法撤销。",
          confirmText: "全部清空"
        }),
        importOk: () => LaterOnDialog.alert({
          tone: "success",
          title: "导入完成",
          message: "当前共 128 篇收藏。"
        }),
        importFail: () => LaterOnDialog.alert({
          tone: "danger",
          title: "导入失败",
          message: "文件格式不正确"
        }),
        shortcuts: () => LaterOnDialog.alert({
          title: "没能自动打开快捷键设置",
          message: "请手动在地址栏输入：chrome://extensions/shortcuts"
        })
      };

      document.querySelectorAll("[data-demo]").forEach((button) => {
        button.addEventListener("click", async () => {
          const key = button.dataset.demo;
          const answer = await demos[key]();
          resultEl.innerHTML = answer === undefined
            ? "刚才是<strong>提示类</strong>弹窗，看完点确认即可。"
            : (answer ? "你点了<strong>确认</strong>（返回 true，应用会继续执行）。" : "你点了<strong>取消</strong>（返回 false，应用什么都不做）。");
        });
      });

      const toggle = document.getElementById("themeToggle");
      toggle.addEventListener("click", () => {
        const dark = document.documentElement.dataset.theme === "dark";
        document.documentElement.dataset.theme = dark ? "light" : "dark";
        toggle.textContent = dark ? "切换深色" : "切换浅色";
      });
    </script>
  </body>
