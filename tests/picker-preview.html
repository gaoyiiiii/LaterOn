<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>预览：网页内的「收藏到哪个项目」浮层</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 0;
        background: #f7f6f2; color: #171614;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* 底下假装是一个正在浏览的网页，这样能看到浮层是怎么盖在网页上的。 */
      .fake-site-header {
        display: flex; align-items: center; gap: 26px;
        padding: 16px 40px; border-bottom: 1px solid #e6e3da; background: #fff;
      }
      .fake-site-logo { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 17px; letter-spacing: -.3px; }
      .fake-site-logo i { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: #1c1b19; color: #fff; font-style: normal; font-size: 14px; }
      .fake-site-nav { display: flex; gap: 20px; color: #8a857c; font-size: 13.5px; }
      .fake-article { max-width: 720px; margin: 46px auto 200px; padding: 0 24px; }
      .fake-tag { display: inline-block; border-radius: 99px; background: #edebe4; color: #6f6b62; font-size: 11.5px; font-weight: 700; padding: 5px 11px; }
      .fake-article h1 { margin: 16px 0 12px; font-size: 34px; line-height: 1.28; letter-spacing: -.9px; }
      .fake-article .fake-meta { color: #9c988f; font-size: 13px; }
      .fake-article p { color: #55524b; font-size: 15.5px; line-height: 1.95; }
      .fake-block { height: 168px; margin: 24px 0; border-radius: 16px; background: linear-gradient(120deg, #e9e6de, #ded9cf); }

      /* 预览页自己的控制条（浮层关掉之后才能点到）。 */
      .preview-bar {
        position: fixed; z-index: 5; top: 18px; right: 18px;
        display: flex; align-items: center; gap: 8px;
        padding: 8px; border: 1px solid #e6e3da; border-radius: 99px; background: rgba(255,255,255,.94);
        box-shadow: 0 10px 30px -14px rgba(20,18,14,.4);
      }
      .preview-bar button {
        border: 0; border-radius: 99px; padding: 9px 16px; background: #f1f0eb; color: #4f4c46;
        font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
      }
      .preview-bar button:hover { background: #e7e5df; }
      .preview-bar button.accent { background: linear-gradient(140deg, #ff7a52, #ff4f2e); color: #fff; }
      .preview-bar span { padding: 0 6px 0 10px; color: #8a857c; font-size: 12px; }
      .preview-tip {
        position: fixed; z-index: 5; left: 50%; bottom: 18px; transform: translateX(-50%);
        padding: 10px 18px; border-radius: 99px; background: rgba(23,22,20,.9); color: #fff;
        font-size: 12.5px; box-shadow: 0 12px 30px -12px rgba(0,0,0,.5);
      }
    </style>
  </head>
  <body>
    <div class="fake-site-header">
      <div class="fake-site-logo"><i>T</i>Topbook</div>
      <nav class="fake-site-nav"><span>首页</span><span>工具</span><span>效率</span><span>关于</span></nav>
    </div>

    <article class="fake-article">
      <span class="fake-tag">效率工具</span>
      <h1>为什么你的「稍后阅读」列表永远读不完</h1>
      <p class="fake-meta">2026 年 9 月 17 日 · 约 6 分钟读完</p>
      <p>这是一段用来充数的正文，目的只是让页面看起来像一个真实的文章页，从而能看出浮层是怎样盖在网页内容之上的。灰色的那层是遮罩，它会让底下的页面变暗，把注意力集中到中间的浮层上。</p>
      <div class="fake-block"></div>
      <p>收藏网页的时候最烦的往往不是「收」，而是「收完之后还要手动归类」。所以这次的浮层会在收藏之前先问一句：这一批要放进哪个项目？选好之后，收藏进来的文章天然就是整理好的状态。</p>
    </article>

    <div class="preview-bar">
      <span>预览</span>
      <button type="button" class="accent" data-theme="light">浅色浮层</button>
      <button type="button" data-theme="dark">深色浮层</button>
    </div>
    <div class="preview-tip">这是真实实现的预览：点灰色遮罩、按 Esc 或点「取消」都能关掉浮层，再回右上角切换浅色 / 深色</div>

    <script>
      // ① 先准备一个「假的扩展环境」：下面的 background.js 会用到这些浏览器接口。
      //    只是为了让真实代码跑起来做预览，不涉及任何真实数据。
      let newFolderSeq = 0;
      window.chrome = {
        runtime: {
          getURL: (path) => path,
          onMessage: { addListener() {} },
          onInstalled: { addListener() {} },
          onStartup: { addListener() {} },
          async sendMessage(message) {
            if (message?.type === "CREATE_PROJECT") {
              newFolderSeq += 1;
              return { ok: true, project: { id: `preview-new-${newFolderSeq}`, name: message.name, createdAt: Date.now() } };
            }
            if (message?.type === "CONFIRM_BATCH_SAVE") return { ok: true, tabCount: 12 };
            if (message?.type === "CANCEL_BATCH_SAVE") return { ok: true, cancelled: true };
            return { ok: true };
          }
        },
        storage: {
          local: { get: async () => ({}), set: async () => {}, remove: async () => {} },
          session: { get: async () => ({}), set: async () => {}, remove: async () => {} }
        },
        tabs: { onUpdated: { addListener() {} }, onRemoved: { addListener() {} } },
        contextMenus: { removeAll() {}, create() {}, onClicked: { addListener() {} } },
        commands: { onCommand: { addListener() {} } },
        action: { setBadgeText: async () => {}, setBadgeBackgroundColor: async () => {} },
        scripting: { insertCSS: async () => {}, executeScript: async () => [] }
      };
    </script>
    <!-- ② 真实的浮层实现由 tests/build-preview.js 从这个占位符处内联进来 -->
    <script>
// ⚠️ 本文件由 tests/build-preview.js 自动生成，请勿直接编辑。
// 下面是真实的选项目面板实现（picker-ui.js + content-folder-picker.js），预览用的就是上线那份。
// 收藏库（全屏页）和网页浮层（content script）共用的「选项目」面板。
//
// openFolderPicker(options) 两种用法共用同一套外观与交互：
//   • 整屏弹窗（收藏网页时选「收藏到哪个项目」）：不传 anchor，背后有灰色遮罩、面板居中。
//   • 贴着按钮的浮层（单篇或批量移动）：传 anchor = 触发它的项目控件，
//     没有遮罩、面板定位在按钮旁边，点外面或按 Esc 关闭。
//
// 之所以抽成共享模块：用户希望卡片上点出来的「窗口」和网页里收藏时那个是同一个，
// 只是出现的位置从「屏幕中央」变成了「按钮旁边」。两种用法走的就是同一份代码。
//
// 约定：本文件不依赖任何外部变量/函数（包括 chrome.* 也不在顶层调用），
// 这样它既能作为 content script 注入网页，也能被扩展页用 <script> 直接加载。
(function () {
  "use strict";

  // 新建项目：默认走后台的 CREATE_PROJECT（content script 和扩展页都通用）；
  // 调用方也可以自己传 onCreateProject 覆盖（比如扩展页想顺带刷新本地列表）。
  async function defaultCreateProject(name) {
    const response = await chrome.runtime.sendMessage({ type: "CREATE_PROJECT", name }).catch(() => null);
    return response?.project || null;
  }

  function openFolderPicker(options) {
    const data = options || {};
    const isPopover = !!data.anchor;

    const HOST_ID = "lateron-folder-picker";
    const stale = document.getElementById(HOST_ID);
    if (stale) stale.remove();

    // 主题：跟着设置走；设置为「跟随系统」时看系统偏好。
    const themeSetting = data.theme || "light";
    const prefersDark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    const dark = themeSetting === "dark" || (themeSetting !== "light" && prefersDark);

    let folders = Array.isArray(data.folders) ? data.folders.slice() : [];
    const pages = Array.isArray(data.pages) ? data.pages : [];
    const savedCount = Number(data.savedCount) || 0;
    let selected = typeof data.selected === "string" ? data.selected : "";
    let busy = false;
    let closed = false;

    const host = document.createElement("div");
    host.id = HOST_ID;
    // 双保险：内联 !important 能压过页面自己的样式表，保证浮层不被页面搞变形。
    host.style.setProperty("all", "initial", "important");

    const shadow = host.attachShadow({ mode: "open" });

    const style = document.createElement("style");
    style.textContent = buildStyle();
    shadow.appendChild(style);

    // 品牌标识（图标 + LaterOn）只在「整屏弹窗」里出现——那是网页里 Alt+1 收藏时弹的那个，
    // 用户需要它说明这是谁弹的窗。贴按钮的浮层（收藏库卡片上点「所属项目」）不出这一行：
    // 人已经在收藏库里了，顶部再写一遍品牌纯属重复，还把项目列表往下挤了一截。
    const brandHtml = isPopover
      ? ""
      : `<div class="lon-brand"><span class="lon-logo">↗</span>LaterOn</div>`;

    const root = document.createElement("div");
    root.className = "lon-root" + (isPopover ? " lon-popover" : "");
    if (dark) root.setAttribute("data-dark", "1");
    root.innerHTML = `
      <div class="lon-backdrop"></div>
      <div class="lon-panel" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="lateron-picker-title">
        <header>
          ${brandHtml}
          <h2 class="lon-title" id="lateron-picker-title"></h2>
          <p class="lon-summary"></p>
        </header>
        <details class="lon-pages">
          <summary><span class="lon-chev">▸</span><span class="lon-pages-label"></span></summary>
          <ul class="lon-page-list"></ul>
        </details>
        <div class="lon-box">
          <div class="lon-folders" role="radiogroup" aria-label="选择项目">
            <div class="lon-folder-list"></div>
            <input class="lon-new-input" maxlength="28" placeholder="" aria-label="新建项目名称" />
          </div>
        </div>
        <footer class="lon-foot">
          <button type="button" class="lon-ghost">取消</button>
          <button type="button" class="lon-primary"></button>
        </footer>
      </div>
    `;
    shadow.appendChild(root);
    document.documentElement.appendChild(host);

    const $ = (selector) => root.querySelector(selector);
    const panel = $(".lon-panel");
    const summaryEl = $(".lon-summary");
    const pagesLabel = $(".lon-pages-label");
    const pageList = $(".lon-page-list");
    const folderList = $(".lon-folder-list");
    const newForm = $(".lon-new");
    const newInput = $(".lon-new-input");
    const confirmBtn = $(".lon-primary");
    const cancelBtn = $(".lon-ghost");

    // 标题 / 摘要 / 页面清单：浮层（改卡片项目）和整屏弹窗（收藏网页）文案不同。
    if (isPopover) {
      $(".lon-title").textContent = data.titleText || "把这篇放到哪个项目？";
      summaryEl.textContent = "";
      $(".lon-pages").hidden = true;
    } else {
      const single = pages.length <= 1;
      // 整屏弹窗的默认标题；单篇收藏时再换成更具体的那句。
      $(".lon-title").textContent = "收藏到哪个项目？";
      if (single) {
        $(".lon-title").textContent = "把这篇收藏到哪个项目？";
        summaryEl.textContent = savedCount > 0
          ? "这篇已经收藏过——确认后会一并移进你选的项目"
          : "选好项目后就会收藏这一篇";
        $(".lon-pages").hidden = true;
      } else {
        summaryEl.textContent = savedCount > 0
          ? `共 ${pages.length} 个标签页，其中 ${savedCount} 个已经收藏过——确认后会一并移进你选的项目`
          : `共 ${pages.length} 个标签页，选好项目后就会开始逐个收藏`;
      }
    }
    pagesLabel.textContent = `查看将要收藏的 ${pages.length} 个页面`;
    pages.forEach((page, index) => {
      const li = document.createElement("li");
      const no = document.createElement("span");
      no.className = "lon-page-no";
      no.textContent = String(index + 1);
      const title = document.createElement("span");
      title.className = "lon-page-title";
      title.textContent = page.title || page.url;
      title.title = page.url || "";
      li.append(no, title);
      pageList.append(li);
    });

    newInput.placeholder = isPopover
      ? "输入新项目名，回车直接移入"
      : "输入新项目名，回车直接收藏进去";

    // 输入框里写下的新项目名（空 = 用上面选中的那个项目）。
    const pendingNewName = () => newInput.value.trim();
    const selectedName = () => {
      if (!selected) return "待整理";
      return folders.find((folder) => folder.id === selected)?.name || "待整理";
    };
    const applyLabel = () => {
      const name = pendingNewName();
      if (name) {
        confirmBtn.textContent = busy
          ? "正在处理…"
          : (isPopover ? `新建「${name}」并移入` : `新建「${name}」并收藏`);
      } else {
        confirmBtn.textContent = busy
          ? "正在处理…"
          : (isPopover ? `移动到「${selectedName()}」` : `收藏到「${selectedName()}」`);
      }
    };

    // 没有封面时的占位缩略图：用项目名首字做一个色块，视觉上仍是「图板缩略图」而不是文件夹。
    function makePlaceholder(name) {
      const span = document.createElement("span");
      span.className = "lon-folder-ph";
      span.textContent = (name || "·").trim().slice(0, 1);
      return span;
    }

    const renderFolders = () => {
      folderList.replaceChildren();
      folders.forEach((folder) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `lon-folder${selected === folder.id ? " is-selected" : ""}`;
        button.setAttribute("role", "radio");
        button.setAttribute("aria-checked", selected === folder.id ? "true" : "false");

        const icon = document.createElement("span");
        icon.className = "lon-folder-icon";
        if (folder.cover) {
          const img = document.createElement("img");
          img.className = "lon-folder-thumb";
          img.src = folder.cover;
          img.alt = "";
          img.loading = "lazy";
          // 封面加载失败（比如远程图被防盗链挡掉）就退回占位色块，不会留个破图。
          img.addEventListener("error", () => icon.replaceChildren(makePlaceholder(folder.name)));
          icon.append(img);
        } else {
          icon.append(makePlaceholder(folder.name));
        }
        const name = document.createElement("span");
        name.className = "lon-folder-name";
        name.textContent = folder.name;
        const count = document.createElement("strong");
        count.className = "lon-folder-count";
        count.textContent = String(folder.count || 0);
        const tick = document.createElement("span");
        tick.className = "lon-folder-tick";
        tick.textContent = "✓";
        button.append(icon, name, count, tick);

        button.addEventListener("click", () => {
          newInput.value = "";
          selected = folder.id;
          renderFolders();
        });
        button.addEventListener("dblclick", () => {
          selected = folder.id;
          renderFolders();
          submitSelection();
        });
        folderList.append(button);
      });
      applyLabel();
    };

    // ── 播放守卫：浮层开着的时候，网页里的视频不该被我们的按键打断 ──────
    // 为什么光拦事件还不够：视频网站的「空格 = 播放/暂停」很可能挂在 window 的捕获阶段，
    // 而且是页面加载时就注册好的 —— 比浮层的监听早，stopPropagation 拦不住；
    // 再加上 Shadow DOM 会把事件目标改写成浮层的根宿主，
    // 网站那句「焦点在输入框里就不响应快捷键」的判断也会失效。
    // 所以这里补最后一道：浮层还开着时被意外暂停的视频，立刻恢复播放。
    let keepPlaying = new WeakSet();
    const rememberPlaying = () => {
      document.querySelectorAll("video, audio").forEach((media) => {
        if (!media.paused && !media.ended) keepPlaying.add(media);
      });
    };
    const onMediaPause = (event) => {
      const media = event.target;
      if (closed || !media || !keepPlaying.has(media)) return;
      if (media.ended) { keepPlaying.delete(media); return; }
      try {
        const playing = media.play?.();
        if (playing && typeof playing.catch === "function") playing.catch(() => {});
      } catch {
        // 播不回去就算了，不能因为这里把浮层搞坏。
      }
    };
    const onMediaEnded = (event) => { keepPlaying.delete(event.target); };
    rememberPlaying();
    window.addEventListener("pause", onMediaPause, true);
    window.addEventListener("ended", onMediaEnded, true);

    const positionPanel = () => {
      if (!isPopover || !data.anchor) return;
      const rect = data.anchor.getBoundingClientRect();
      const pw = panel.offsetWidth || 360;
      const ph = panel.offsetHeight || 360;
      // 优先放在按钮下方；放不下就翻到上方。水平方向贴着按钮左缘并夹在视口内。
      let top = rect.bottom + 8;
      if (top + ph > window.innerHeight - 8) top = rect.top - ph - 8;
      if (top < 8) top = 8;
      let left = Math.min(Math.max(8, rect.left), Math.max(8, window.innerWidth - pw - 8));
      panel.style.top = `${top}px`;
      panel.style.left = `${left}px`;
    };

    const close = () => {
      if (closed) return;
      closed = true;
      window.removeEventListener("keydown", onKeydown, true);
      window.removeEventListener("keyup", onKeyup, true);
      window.removeEventListener("keydown", onPopoverKeydown, true);
      window.removeEventListener("scroll", positionPanel, true);
      window.removeEventListener("resize", positionPanel);
      window.removeEventListener("pause", onMediaPause, true);
      window.removeEventListener("ended", onMediaEnded, true);
      keepPlaying = new WeakSet();
      root.classList.remove("is-in");
      root.classList.add("is-out");
      window.setTimeout(() => host.remove(), 260);
    };

    // 输入框里写了新项目名 → 先建项目，再应用进去。
    const resolveProjectId = async () => {
      const name = pendingNewName();
      if (!name) return { ok: true, projectId: selected || null };
      const create = data.onCreateProject || defaultCreateProject;
      const project = await create(name);
      if (!project || !project.id) return { ok: false, error: "新建项目失败，请重试。" };
      if (!folders.some((folder) => folder.id === project.id)) {
        folders = [...folders, { id: project.id, name: project.name, count: 0 }];
      }
      selected = project.id;
      renderFolders();
      return { ok: true, projectId: project.id };
    };

    const submitSelection = async () => {
      if (busy || closed) return;
      busy = true;
      confirmBtn.disabled = true;
      applyLabel();
      const target = await resolveProjectId();
      if (!target.ok) {
        busy = false;
        confirmBtn.disabled = false;
        applyLabel();
        summaryEl.textContent = target.error;
        return;
      }
      // onPick 返回 { ok:false, error } 表示这次没成功（比如这一批已经被处理过），
      // 留在浮层里说明原因，让用户再操作一次；其余情况（成功 / 没返回值）直接关掉。
      let result;
      try {
        result = data.onPick ? await data.onPick(target.projectId, selectedName()) : null;
      } catch (error) {
        result = { ok: false, error: (error && error.message) || "操作失败，请重试。" };
      }
      if (result && result.ok === false) {
        busy = false;
        confirmBtn.disabled = false;
        applyLabel();
        if (result.error) summaryEl.textContent = result.error;
        return;
      }
      close();
    };

    const cancel = async () => {
      if (busy || closed) return;
      busy = true;
      if (data.onCancel) { try { await data.onCancel(); } catch { /* 取消失败也不拦着关掉 */ } }
      close();
    };

    // 键盘事件统一在捕获阶段处理：比页面自己的快捷键听得早，抢得到；
    // 用 composedPath 判断焦点是否在浮层的输入框里（Shadow DOM 里的 target 会被重定向）。
    const typingInInput = (event) => event.composedPath().includes(newInput);

    function onKeydown(event) {
      if (closed) return;
      if (event.key === "Escape") {
        event.preventDefault();
        event.stopPropagation();
        cancel();
        return;
      }
      if (event.isComposing || event.keyCode === 229 || event.altKey || event.ctrlKey || event.metaKey) return;
      if (typingInInput(event)) return;
      if (event.key === "Enter") {
        event.preventDefault();
        event.stopPropagation();
        submitSelection();
        return;
      }
      if (event.key !== "Tab") event.preventDefault();
      event.stopPropagation();
    }

    function onKeyup(event) {
      if (closed || typingInInput(event)) return;
      event.stopPropagation();
    }

    // 浮层（贴着卡片按钮）只拦 Esc：其余按键照常放行给网页/扩展页，
    // 否则会误伤页面里正在打字的搜索框等。输入框自己的按键在下面那一层就地兜住。
    function onPopoverKeydown(event) {
      if (closed) return;
      if (event.key === "Escape") {
        event.preventDefault();
        event.stopPropagation();
        cancel();
      }
    }

    // 输入框里的正常打字：事件在输入框这一层就地拦住、不再往外传。
    const swallowTyping = (event) => event.stopPropagation();
    newInput.addEventListener("keyup", swallowTyping);
    newInput.addEventListener("keypress", swallowTyping);
    newInput.addEventListener("input", () => { if (!busy) applyLabel(); });
    newInput.addEventListener("keydown", (event) => {
      if (event.isComposing || event.keyCode === 229) { swallowTyping(event); return; }
      if (event.key === "Enter") {
        event.preventDefault();
        event.stopPropagation();
        submitSelection();
        return;
      }
      swallowTyping(event);
    });

    confirmBtn.addEventListener("click", submitSelection);
    cancelBtn.addEventListener("click", cancel);
    $(".lon-backdrop").addEventListener("click", cancel);

    if (isPopover) {
      window.addEventListener("keydown", onPopoverKeydown, true);
      // 滚动 / 缩放时跟着按钮重新定位，别留在原地。
      window.addEventListener("scroll", positionPanel, true);
      window.addEventListener("resize", positionPanel);
    } else {
      window.addEventListener("keydown", onKeydown, true);
      window.addEventListener("keyup", onKeyup, true);
    }

    renderFolders();
    if (isPopover) positionPanel();
    panel.focus({ preventScroll: true });
    // 入场动画：下一帧再加类，保证 transition 生效。
    window.requestAnimationFrame(() => root.classList.add("is-in"));

    return { close };
  }

  function buildStyle() {

// 注入到网页里执行的「选项目浮层」——整屏模态用法。
// 真正的面板 UI / 交互在 picker-ui.js 的 openFolderPicker 里（和全屏卡片上那个浮层是同一份）。
// 本文件只负责把后台传来的 payload 翻译成 openFolderPicker 的调用，并接上收藏流程的消息。
//
// ⚠️ 必须自包含地被注入：不依赖任何外部变量，只靠 window.openFolderPicker
//    （由先于本文件注入的 picker-ui.js 提供）。
// 整个入口包在函数作用域里：chrome.scripting.executeScript 可能在同一网页反复注入本文件，
// 顶层 const / let 会留在同一个脚本世界里，第二次声明就会直接抛 SyntaxError。
(() => {
function showFolderPickerOverlay(payload) {
  const data = payload || {};

  // 主题：跟着扩展设置走；设置为「跟随系统」时看系统偏好。
  const theme = data.theme || "light";
  const folders = Array.isArray(data.folders) ? data.folders : [];
  const pages = Array.isArray(data.pages) ? data.pages : [];
  const savedCount = Number(data.savedCount) || 0;
  const selected = typeof data.selected === "string" ? data.selected : "";

  if (typeof window.openFolderPicker !== "function") {
    // picker-ui.js 没先于本文件注入：收藏流程没法继续，安静退出；后台会重试网页内浮层。
    return;
  }

  window.openFolderPicker({
    theme,
    folders,
    selected,
    pages,
    savedCount,
    // 新建项目 / 确认收藏 / 取消收藏：都走后台那一套，行为和以前完全一致。
    // onCreateProject 按约定返回「项目对象 {id,name}」（不是后台那层 {ok,project} 包装），
    // 所以这里把响应拆开再交出去。
    onCreateProject: async (name) => {
      const response = await chrome.runtime.sendMessage({ type: "CREATE_PROJECT", name }).catch(() => null);
      return response?.project || null;
    },
    onPick: (projectId) => chrome.runtime.sendMessage({ type: "CONFIRM_BATCH_SAVE", projectId }),
    onCancel: () => chrome.runtime.sendMessage({ type: "CANCEL_BATCH_SAVE" })
  });
}

// 后台把配置放进一个一次性 JSON 节点再执行本文件：从这里读出 payload。
// 仅在节点确实存在时才自动弹出——预览页不会带上这个节点，就不会在加载时误弹一个空浮层。
  const laterOnPickerPayloadNode = document.getElementById("lateron-picker-payload-data");
  let laterOnPickerPayload = null;
  try { laterOnPickerPayload = JSON.parse(laterOnPickerPayloadNode?.textContent || "null"); } catch {}
  laterOnPickerPayloadNode?.remove();

  // 预览页会直接调用这个入口；重复注入时覆盖同名属性是安全的。
  window.showFolderPickerOverlay = showFolderPickerOverlay;
  if (laterOnPickerPayload) showFolderPickerOverlay(laterOnPickerPayload);
})();

</script>

        document.getElementById("lateron-folder-picker")?.remove();
